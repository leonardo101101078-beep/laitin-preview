<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1426" />
    <title>LAITIN 萊廷照明｜分頁預覽</title>
    <script>
      try {
        const rootData = document.documentElement.dataset;
        if (localStorage.getItem("laitin-theme") === "light") rootData.theme = "light";
        const paletteDark = localStorage.getItem("laitin-palette-dark");
        const paletteLight = localStorage.getItem("laitin-palette-light");
        if (paletteDark && paletteDark !== "a") rootData.paletteDark = paletteDark;
        if (paletteLight && paletteLight !== "b") rootData.paletteLight = paletteLight;
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="preview.css" />
    <script src="分頁資料/1.可調色燈具系列/0. 分頁資料/product-data.js" defer></script>
    <script src="preview-data.js" defer></script>
    <script src="preview.js" defer></script>
    <script src="background.js" defer></script>
    <script src="palette-lab.js" defer></script>
  </head>
  <body>
    <div class="bg-fx" id="bgFx" aria-hidden="true">
      <div class="bg-aurora"><span></span><span></span><span></span></div>
      <div class="bg-spotlight"></div>
      <canvas class="bg-particles"></canvas>
    </div>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="?page=1" aria-label="LAITIN 萊廷照明，前往可調色燈具系列">
          <span class="brand-latin" aria-hidden="true">L<span class="brand-a">A</span>ITIN</span>
          <span class="brand-zh">萊廷照明</span>
        </a>
        <div class="header-actions">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="深色模式" aria-pressed="true">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          </button>
          <button class="menu-button" id="menuButton" type="button" aria-label="開啟綜合選單" aria-haspopup="dialog">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>
      <main id="previewRoot" tabindex="-1"></main>
    </div>

    <dialog class="site-menu" id="siteMenu" aria-labelledby="siteMenuTitle">
      <div class="menu-panel">
        <header class="dialog-header">
          <div>
            <p>LAITIN</p>
            <h2 id="siteMenuTitle">綜合選單</h2>
          </div>
          <button class="icon-button" data-close="siteMenu" type="button" aria-label="關閉綜合選單">×</button>
        </header>
        <nav class="page-menu" id="pageMenu" aria-label="網站分頁"></nav>
      </div>
    </dialog>

    <dialog class="gallery-dialog" id="galleryDialog" aria-labelledby="galleryTitle">
      <div class="gallery-dialog-card">
        <header class="dialog-header gallery-header">
          <div>
            <p>產品介紹</p>
            <h2 id="galleryTitle">產品介紹</h2>
          </div>
          <button class="icon-button" data-close="galleryDialog" type="button" aria-label="關閉產品介紹">×</button>
        </header>
        <div class="gallery-dialog-body">
          <div class="gallery-copy" id="galleryCopy"></div>
          <div class="gallery-grid" id="galleryGrid"></div>
        </div>
      </div>
    </dialog>

    <dialog class="spec-dialog" id="specDialog" aria-labelledby="specDialogTitle">
      <div class="spec-dialog-card">
        <header class="dialog-header spec-dialog-header">
          <div>
            <p id="specDialogSubtitle">產品品項</p>
            <h2 id="specDialogTitle">規格表</h2>
          </div>
          <button class="icon-button" data-close="specDialog" type="button" aria-label="關閉規格表">×</button>
        </header>
        <div class="spec-list" id="specList"></div>
      </div>
    </dialog>
  </body>
</html>
